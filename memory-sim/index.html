<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simulador interactivo de gestión de memoria de sistema operativo — particiones fijas, variables y dinámicas con algoritmos First Fit, Best Fit y Worst Fit." />
  <title>Simulador de Gestión de Memoria — OS Memory Sim</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="app-header">
  <h1>⚙ Simulador de Gestión de Memoria</h1>
  <span class="step-badge" id="stepBadge">Paso 0</span>
</header>

<div class="app" id="app">

  <!-- ===== LEFT: Control Panel ===== -->
  <aside class="panel control-panel" id="controlPanel">
    <h2>Panel de Control</h2>

    <label for="partitionMode">Modo de Partición</label>
    <select id="partitionMode">
      <option value="fixed">Fijas (1 MiB c/u)</option>
      <option value="variable">Variables predefinidas</option>
      <option value="dynamic">Dinámicas</option>
    </select>

    <label for="algorithm">Algoritmo</label>
    <select id="algorithm">
      <option value="firstFit">First Fit</option>
      <option value="bestFit">Best Fit</option>
      <option value="worstFit">Worst Fit</option>
    </select>

    <div id="compactionWrap" class="hidden">
      <label class="checkbox-label">
        <input type="checkbox" id="compactionToggle" />
        <span>Compactación automática</span>
      </label>
    </div>

    <label for="osSize">Tamaño SO (MiB)</label>
    <input type="number" id="osSize" min="1" max="6" value="1" />

    <div class="btn-group">
      <button id="stepBtn" class="btn btn-primary" title="Avanzar un paso">▶ Paso</button>
      <button id="autoBtn" class="btn btn-secondary" title="Auto 600ms/tick">⏵ Auto</button>
      <button id="resetBtn" class="btn btn-danger" title="Reiniciar">↺</button>
    </div>

    <!-- Add Process Form -->
    <h3>Agregar Proceso</h3>
    <p class="form-desc">Segmentos de memoria en KB</p>
    <div class="add-proc-form" id="addProcForm">
      <div class="form-group full-width">
        <label>Nombre</label>
        <input type="text" id="procName" placeholder="Ej: Firefox" value="MyProc" />
      </div>
      <div class="form-group">
        <label>Text (KB)</label>
        <input type="number" id="procText" value="128" />
      </div>
      <div class="form-group">
        <label>Data (KB)</label>
        <input type="number" id="procData" value="32" />
      </div>
      <div class="form-group">
        <label>BSS (KB)</label>
        <input type="number" id="procBss" value="16" />
      </div>
      <div class="form-group">
        <label>Heap (KB)</label>
        <input type="number" id="procHeap" value="48" />
      </div>
      <div class="form-group">
        <label>Stack (KB)</label>
        <input type="number" id="procStack" value="32" />
      </div>
      <div class="form-group">
        <label>Burst (pasos)</label>
        <input type="number" id="procBurst" value="3" />
      </div>
      <div class="form-group">
        <label>Intervalo (pasos)</label>
        <input type="number" id="procInterval" value="2" />
      </div>
    </div>
    <button id="addProcBtn" class="btn btn-add">+ Agregar Proceso</button>

    <h3>Registro de Eventos</h3>
    <div class="event-log" id="eventLog"></div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- Top: Memory map + Process cards -->
    <section class="top-row">
      <div class="panel memory-panel" id="memoryPanel">
        <h2>Mapa de Memoria</h2>
        <div class="memory-bar-wrap">
          <div class="memory-bar" id="memoryBar"></div>
          <div class="memory-tooltip" id="memTooltip"></div>
        </div>
        <div class="metrics" id="metrics"></div>
      </div>

      <div class="panel process-panel" id="processPanel">
        <h2>Procesos</h2>
        <div class="process-cards" id="processCards"></div>
      </div>
    </section>

    <!-- Middle: Memory History -->
    <section class="mid-row">
      <div class="panel history-panel" id="historyPanel">
        <h2>Historial de Memoria</h2>
        <div class="memory-history" id="memoryHistory"></div>
      </div>
    </section>

    <!-- Bottom: Partition Table -->
    <section class="bottom-row">
      <div class="panel table-panel" id="tablePanel">
        <h2>Tabla de Particiones</h2>
        <div class="table-wrap" id="partitionTableWrap"></div>
      </div>
    </section>

  </main>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
